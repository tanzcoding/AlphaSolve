# 默认通过 Codex 的 ChatGPT 登录使用 GPT 5.6 Luna。
gpt-5.6-luna:
  provider: chatgpt
  model: gpt-5.6-luna

# 保留 GPT 5.6 Sol 最大思考强度，供自定义 tier 映射选用。
gpt-5.6-sol:
  provider: chatgpt
  model: gpt-5.6-sol
  reasoning_effort: max

# 需要固定模型时，可在 tiers.yaml 中选用此 preset 或添加自己的配置。
gpt-5.5:
  provider: chatgpt
  model: gpt-5.5
  reasoning_effort: high

# 以下均为普通按量 API，通过 Codex 的 Responses provider 接入。
# 只有 tier 实际选用这些 preset 时才会调用相应服务，不会作为订阅失败后的回退。
deepseek-flash:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-flash
  reasoning_effort: high

deepseek-pro:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-pro
  reasoning_effort: high

qwen-3.7-max:
  provider: qwen
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  model: qwen3.7-max

moonshot-kimi:
  provider: moonshot
  base_url: https://api.moonshot.cn/v1
  api_key_env: MOONSHOT_API_KEY
  model: kimi-k3
