version: 1
agent:
  name: research_reviewer
  system_prompt_path: ../../prompts/research_reviewer.md
  tier: balanced
  max_turns: 150
  max_tokens: 24576
  when_to_use: Survey verified_propositions/ and knowledge/ when there are many files, compare against problem.md, identify the current global blocker, adversarially review your own draft plan (via the Agent tool), and use numerical_experiment_subagent for any decision-relevant bounded numerical or combinatorial uncertainty before finalizing one research plan.
  tools:
    - Agent
    - ResearchProgressReview
    - InspectMarkdown
    - Read
    - ListDir
    - Glob
    - Grep
  tool_parameters:
    Agent:
      type:
        enum:
          - reasoning_subagent
          - numerical_experiment_subagent
  tool_descriptions:
    Agent:
      suffix: |-
        - Use `reasoning_subagent` to adversarially review your OWN draft "Research Plan" before finalizing it (see your system prompt's "Adversarially review your own plan" section) — this is mandatory, not optional.
        - Use `numerical_experiment_subagent` to sanity-check a numerical conjecture or enumerate small cases before committing to a plan built on it.
        - Do NOT call `research_reviewer` (yourself) — it is not in your allowed types.
    Read:
      suffix: |-
        - Results respect this agent's workspace access restrictions.
        - When reading a proof, compare its statement, proof tail, and any stated objective conversion. Important research conclusions are sometimes proved in the body but not exposed in the statement or index.
      parameters:
        path:
          description: "The path to the file to read (must be absolute or workspace-relative)."
        line_offset:
          description: "The line number to start reading from. By default read from the beginning of the file. Set this when the file is too large to read at once."
        n_lines:
          description: "How many lines to return in this Read call. Defaults to 250. At most 1000 unless `read_all` is true."
        read_all:
          description: "If true, ignore n_lines and return every line from line_offset through the end of the file."
    Glob:
      override: "Fast file pattern matching tool that works with any codebase size. Supports glob patterns like ``**/*.md`` or ``src/**/*.py``, or ``*`` to list directory contents."
      parameters:
        path:
          description: "The directory to search in. Defaults to this agent's configured search root."
    ListDir:
      suffix: "- The result respects this agent's workspace access restrictions."
      parameters:
        path:
          description: "Directory to list. Defaults to this agent's configured read root."
    Grep:
      suffix: |-
        - Results respect this agent's workspace access restrictions.
        - Use targeted Grep to check whether a suspected blocker is already resolved elsewhere before recommending work on it.
      parameters:
        pattern:
          description: "The text or regular expression pattern to search for in file contents."
        path:
          description: "File or directory to search in. Defaults to this agent's configured search root."
        regex:
          description: "Treat pattern as a regex (default: true; set false for substring matching)."
        context_lines:
          description: "Number of context lines around each match."
