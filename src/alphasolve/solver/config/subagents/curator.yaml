version: 1
agent:
  name: curator
  prompt_path: ../../prompts/curator.md
  tier: cheap
  max_turns: 80
  when_to_use: Incrementally update the knowledge wiki from local traces and synthesize portfolio checkpoints by comparing worker outcomes and process audits.
  tools:
    - Read
    - Write
    - Edit
    - MakeDir
    - Rename
    - Move
    - SplitReference
    - Delete
    - ListDir
    - Glob
    - Grep
    - Agent
    - CurateDifficultyDag
  tool_parameters:
    Read:
      path:
        pattern: "^(?:(?:knowledge|progress_audits|curation_records|verified_propositions)(?:/[A-Za-z0-9][A-Za-z0-9._-]*)+\\.(?:md|json)|progress_audit_outcomes\\.jsonl|curation_records/difficulty_dag\\.json)$"
    Write:
      path:
        pattern: "^knowledge/(?!references(?:/|$))(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*\\.md$"
      mode:
        enum:
          - overwrite
          - append
    Edit:
      path:
        pattern: "^knowledge/(?!references(?:/|$))(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*\\.md$"
    MakeDir:
      path:
        pattern: "^knowledge(?:/[A-Za-z0-9][A-Za-z0-9._-]*)+/?$"
    Rename:
      directory:
        pattern: "^knowledge(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*/?$"
      old_name:
        pattern: "^(?!index\\.md$)(?!common-errors\\.md$)[A-Za-z0-9][A-Za-z0-9._-]*(?:\\.md)?$"
      new_name:
        pattern: "^(?!index\\.md$)(?!common-errors\\.md$)[A-Za-z0-9][A-Za-z0-9._-]*(?:\\.md)?$"
    Move:
      path:
        pattern: "^knowledge/(?!index\\.md$)(?!common-errors\\.md$)(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*\\.md$"
      destination_dir:
        pattern: "^knowledge(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*/?$"
    SplitReference:
      source_path:
        pattern: "^knowledge/references(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*/[A-Za-z0-9][A-Za-z0-9._-]*\\.md$"
      parts:
        type: array
    Delete:
      path:
        pattern: "^knowledge/(?!references(?:/|$))(?!index\\.md$)(?!common-errors\\.md$)[A-Za-z0-9][A-Za-z0-9._-]*(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*(?:\\.md)?/?$"
    ListDir:
      path:
        default: knowledge
        pattern: "^(?:knowledge|progress_audits|curation_records)(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*/?$"
      max_results:
        default: 100
        minimum: 1
        maximum: 500
    Glob:
      path:
        default: knowledge
        pattern: "^(?:knowledge|progress_audits|curation_records)(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*/?$"
      max_results:
        default: 100
        minimum: 1
        maximum: 500
    Grep:
      path:
        default: knowledge
        pattern: "^(?:knowledge|progress_audits|curation_records|verified_propositions)(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*(?:\\.(?:md|json|jsonl))?/?$"
      max_results:
        default: 20
        minimum: 1
        maximum: 100
      context_lines:
        default: 1
        minimum: 0
        maximum: 3
    Agent:
      type:
        enum:
          - compute_subagent
          - reasoning_subagent
  tool_descriptions:
    Read:
      suffix: "- Results respect this agent's workspace access restrictions."
      parameters:
        path:
          description: "The path to the file to read (must be absolute or workspace-relative)."
        line_offset:
          description: "The line number to start reading from. By default read from the beginning of the file. Set this when the file is too large to read at once."
        n_lines:
          description: "How many lines to return in this Read call. Defaults to 250. At most 1000 unless `read_all` is true."
        read_all:
          description: "If true, ignore n_lines and return every line from line_offset through the end of the file."
    Write:
      override: |-
        Writes a file within this agent's allowed write area.

        Usage:
        - Use `mode="overwrite"` to replace the whole file.
        - Use `mode="append"` to append content to the end of the file.
        - If this is an existing file, you MUST use the Read tool first to read the file's contents.
        - Do not use this under `knowledge/references/`; that directory contains human-provided source material.
      parameters:
        mode:
          description: "Whether to overwrite the whole file or append to the end."
    Edit:
      override: |-
        Performs exact string replacements in files.

        Usage:
        - The edit will FAIL if old_string is not unique in the file.
        - Provide a larger string with more surrounding context to make it unique.
        - Do not use this under `knowledge/references/`; that directory contains human-provided source material.
      parameters:
        new_str:
          description: "The text to replace it with (must be different from old_string)."
    MakeDir:
      override: "Creates a directory within the writable workspace area, including parent directories when needed."
    Rename:
      override: |-
        Renames a file or directory in place within the writable workspace area.

        Usage:
        - Use this only when the item stays in the same directory and only its name changes.
        - `directory` is the parent directory that currently contains the item.
        - `old_name` and `new_name` must be plain names, not paths, and must not contain `/` or `\`.
        - To move a file into another directory, use Move instead.
        - Some agents are configured to preserve Markdown file names; in those sessions, renaming `.md` files fails and Move must keep the same file name.
        - This tool fails if the target path already exists.

        Examples:
        - Rename a folder: directory="verified_propositions", old_name="graph-route", new_name="graph-coloring-route".
        - Rename a knowledge page: directory="knowledge/number-theory", old_name="orders.md", new_name="multiplicative-orders.md".
      parameters:
        directory:
          description: "Parent directory containing the item to rename."
        old_name:
          description: "Current file or directory name only; no path separators."
        new_name:
          description: "New file or directory name only; no path separators."
    Move:
      override: |-
        Moves a file into another directory within the writable workspace area while keeping the same file name.

        Usage:
        - Use this when reorganizing files into topic folders.
        - `path` must be an existing file.
        - `destination_dir` must be an existing directory.
        - Move never renames the file; it always keeps the source file name.
        - For `knowledge/references/`, Move may reorganize files within the references tree, but must not move non-reference files into references or reference files out of references.
        - When moving files inside verified_propositions/, Move automatically updates matching `\ref{old-path}` references across verified_propositions/ to the new backslash-separated path.
    SplitReference:
      override: |-
        Split a large user-provided Markdown reference into smaller Markdown files without rewriting its text.

        Usage:
        - Use this only for files under `knowledge/references/`.
        - Each part copies an exact inclusive line range from the source file into a new Markdown file.
        - SplitReference never edits the source file and never rewrites, summarizes, or paraphrases reference text.
        - Create destination folders first with MakeDir when needed.
        - Use this when a long reference file is hard for LLM agents to read as one piece.
    Delete:
      override: |-
        Deletes a file or empty directory from the writable workspace area.

        Usage:
        - Only delete files after useful content has been consolidated elsewhere.
        - Directories must already be empty; this tool will not recursively delete directory contents.
    Glob:
      override: "Fast file pattern matching tool that works with any codebase size. Supports glob patterns like ``**/*.md`` or ``src/**/*.py``, or ``*`` to list directory contents."
      parameters:
        path:
          description: "The directory to search in. Defaults to this agent's configured search root."
    ListDir:
      suffix: "- The result respects this agent's workspace access restrictions."
      parameters:
        path:
          description: "Directory to list. Defaults to this agent's configured read root."
    Grep:
      suffix: "- Results respect this agent's workspace access restrictions."
      parameters:
        pattern:
          description: "The text or regular expression pattern to search for in file contents."
        path:
          description: "File or directory to search in. Defaults to this agent's configured search root."
        regex:
          description: "Treat pattern as a regex (default: true; set false for substring matching)."
        context_lines:
          description: "Number of context lines around each match."
