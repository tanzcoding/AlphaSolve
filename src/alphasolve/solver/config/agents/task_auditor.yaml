version: 1
agent:
  name: task_auditor
  system_prompt_path: ../../prompts/task_auditor.md
  tier: cheap
  max_turns: 30
  tools:
    - Read
    - ListDir
    - Glob
    - Grep
  tool_descriptions:
    Read:
      suffix: |-
        - Results respect this auditor's read-only workspace access restrictions.
        - Read the proven Statement first. Open the proof body, review, or theorem check only when a rubric criterion cannot be settled from the Statement.
      parameters:
        path:
          description: "The path to the file to read (must be absolute or workspace-relative)."
        line_offset:
          description: "The line number to start reading from. By default read from the beginning of the file."
        n_lines:
          description: "How many lines to return in this Read call. Defaults to 250. At most 1000 unless `read_all` is true."
        read_all:
          description: "If true, ignore n_lines and return every line from line_offset through the end of the file."
    Glob:
      override: "Fast file pattern matching for locating the cited proposition, review, or verified artifact of this one worker."
      parameters:
        path:
          description: "The directory to search in. Defaults to this agent's configured search root."
    ListDir:
      suffix: "- Results respect this auditor's read-only workspace access restrictions."
      parameters:
        path:
          description: "Directory to list. Defaults to this agent's configured read root."
    Grep:
      suffix: |-
        - Results respect this auditor's read-only workspace access restrictions.
        - Use targeted searches only to confirm whether the Statement contains a rubric-required quantifier, bound, or condition.
      parameters:
        pattern:
          description: "The text or regular expression pattern to search for in file contents."
        path:
          description: "File or directory to search in. Defaults to this agent's configured search root."
        regex:
          description: "Treat pattern as a regex (default: true; set false for substring matching)."
        context_lines:
          description: "Number of context lines around each match."
